<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Huiyi Kitchen</title>
  <script>
    // The site is now one page (index.html). Old links like category.html?kind=rice
    // land on the matching view: index.html#/kind/rice
    (function () {
      var params = new URLSearchParams(window.location.search);
      var hash = "#/";
      params.forEach(function (value, key) { if (hash === "#/") hash = "#/" + key + "/" + value; });
      window.location.replace("index.html" + hash);
    })();
  </script>
</head>
<body>
  <p><a href="index.html">Go to Huiyi Kitchen</a></p>
</body>
</html>
